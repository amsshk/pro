<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ProAds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=Noto+Sans+Arabic:wght@400;600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'%3E%3Crect width='28' height='28' rx='8' fill='%23A78BFA'/%3E%3Cpath d='M6 17l4-4 4 3 7-8' stroke='%230D0C12' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  color-scheme: dark;
  --ink:#0D0C12; --nav:#09080D; --card:#15131D; --line:#26232F; --soft:#1C1A25; --field:#110F17; --edge:#34303F;
  --text:#F2EFE8; --muted:#A9A4B8; --dim:#8E8A9C; --violet:#A78BFA; --violet-hi:#DDD6FE; --violet-txt:#C4B5FD;
  --violet-chip:#241B3D; --violet-card:#1C1530; --violet-edge:#3B2C66; --bubble:#2A2342;
  --amber:#F5B544; --amber-txt:#F5C66B; --amber-bg:#2A1D0E; --amber-chip:#3A2A0C; --loss-bg:#3B2412; --loss-txt:#FDBA74;
  --head:'Space Grotesk', Inter, sans-serif; --body: Inter, system-ui, sans-serif; --ar:'Noto Sans Arabic', Inter, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:var(--text);font-family:var(--body);font-size:15px}
a{color:var(--violet)}a:hover{color:var(--violet-hi)}
button,input,select,textarea{font:inherit;color:var(--text)}
input,select,textarea{background:var(--field);border:1px solid var(--edge);border-radius:10px;padding:0 12px;min-height:44px;width:100%}
textarea{padding:10px 12px;min-height:80px;resize:vertical}
input::placeholder,textarea::placeholder{color:var(--dim)}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.shell{display:flex;flex-wrap:wrap;min-height:100vh}
nav.side{flex:1 1 232px;max-width:260px;min-width:220px;background:var(--nav);border-right:1px solid var(--soft);padding:28px 20px;display:flex;flex-direction:column;gap:28px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--head);font-weight:700;font-size:20px}
.navlinks{display:flex;flex-direction:column;gap:4px}
.navlinks a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:#C2BDD0;text-decoration:none;font-size:14px;min-height:44px}
.navlinks a[aria-current="page"]{background:var(--violet);color:var(--ink);font-weight:600}
.navlinks a:not([aria-current="page"]):hover{background:#1A1824;color:var(--text)}
.biz{background:#1A1824;border-radius:10px;padding:12px;font-size:14px;display:flex;flex-direction:column;gap:2px}
.biz small{color:var(--dim);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.statusbox{margin-top:auto;background:#1A1824;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 8px}
.srow{display:flex;align-items:center;gap:8px}
main{flex:999 1 560px;min-width:0;padding:32px clamp(16px,3vw,48px) 56px}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
h1{margin:0;font-family:var(--head);font-size:34px;font-weight:700;letter-spacing:-.01em}
h2{margin:0;font-family:var(--head);font-size:20px;font-weight:600}
.sub{margin:0;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:16px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:24px}
.row>.card{flex:1 1 420px}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.periods{display:flex;gap:6px;flex-wrap:wrap}
.periods button{background:var(--card);border:1px solid var(--edge);border-radius:10px;min-height:38px;padding:0 14px;font-size:13px;font-weight:600;cursor:pointer}
.periods button[aria-pressed="true"]{background:var(--violet);border-color:var(--violet);color:var(--ink)}
.mstrip{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.mstrip button{background:none;border:0;border-right:1px solid var(--line);border-bottom:3px solid transparent;text-align:left;padding:16px 18px 12px;display:flex;flex-direction:column;gap:6px;cursor:pointer;min-width:0}
.mstrip button:last-child{border-right:0}
.mstrip button:hover{background:var(--soft)}
.mstrip button[aria-pressed="true"]{border-bottom-color:var(--violet);background:#191624}
.mstrip .ml{font-size:13px;color:var(--muted);text-decoration:underline dotted var(--edge);text-underline-offset:4px}
.mstrip .mv{font-family:var(--head);font-size:24px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chg{font-size:12px;font-weight:600;display:inline-flex;gap:4px;align-items:center}
.chg.up{color:var(--violet-txt)}.chg.down{color:var(--amber-txt)}.chg.flat{color:var(--dim)}
.chartwrap{position:relative}
.chartwrap svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:#211E2B;border:1px solid var(--edge);border-radius:10px;padding:10px 12px;font-size:13px;display:flex;flex-direction:column;gap:4px;min-width:170px;z-index:2;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.tip .r{display:flex;justify-content:space-between;gap:14px}
.key{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.key i{display:inline-block;width:16px;height:0;border-top:2px solid var(--violet)}
.key i.prev{border-top:2px dashed #6E6880}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;font-size:14px}
.hbar .track{grid-column:1/-1;height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.hbar .track div{height:100%;border-radius:4px;background:var(--violet)}
.guide{display:flex;flex-direction:column;gap:2px}
.guide a{display:flex;gap:12px;align-items:flex-start;padding:10px;border-radius:10px;text-decoration:none;color:var(--text)}
.guide a:hover{background:var(--soft)}
.guide .tick{flex:0 0 22px;height:22px;border-radius:50%;border:2px dashed var(--edge);display:flex;align-items:center;justify-content:center}
.guide .done .tick{border:0;background:var(--violet)}
.guide .done b{color:var(--muted);text-decoration:line-through}
.progress{height:6px;border-radius:3px;background:var(--soft);overflow:hidden}.progress div{height:100%;background:var(--violet)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:8px}
.kpi.hi{background:var(--violet-card);border-color:var(--violet-edge)}
.kpi .label{font-size:13px;color:var(--muted)}
.kpi.hi .label{color:var(--violet-txt)}
.kpi .num{font-family:var(--head);font-size:30px;font-weight:600}
.kpi .num small{font-size:16px;color:var(--muted);font-weight:500}
.kpi .note{font-size:13px;color:var(--muted)}
.badge{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.b-measured{color:var(--violet-txt);background:var(--violet-chip)}
.b-est{color:var(--amber-txt);background:var(--amber-chip)}
.b-neutral{color:#CFCADB;background:var(--line)}
.actions{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.actions li{display:flex;gap:14px;padding:16px;border-radius:12px;background:var(--violet-card);line-height:1.5}
.actions li.warn{background:var(--amber-bg)}
.num-dot{flex:0 0 32px;height:32px;border-radius:50%;background:var(--violet);color:var(--ink);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px}
.warn .num-dot{background:var(--amber)}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:460px}
th{text-align:left;color:var(--muted);font-weight:500;font-size:13px;padding:10px 8px;border-bottom:1px solid var(--line)}
td{padding:12px 8px;border-bottom:1px solid var(--soft)}
.scroll{overflow-x:auto}
.pill-loss{color:var(--loss-txt);background:var(--loss-bg);padding:3px 8px;border-radius:6px;font-weight:600}
.pill-gain{color:var(--violet-txt);background:var(--violet-chip);padding:3px 8px;border-radius:6px;font-weight:600}
.bar{height:10px;background:var(--soft);border-radius:999px;overflow:hidden}
.bar>div{height:100%;background:var(--amber)}
.months{display:flex;align-items:flex-end;gap:10px;height:160px;padding-top:8px}
.month{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;height:100%;justify-content:flex-end}
.month .col{width:100%;max-width:56px;background:var(--violet);border-radius:8px 8px 3px 3px;min-height:4px}
.month span{font-size:12px;color:var(--muted);white-space:nowrap}
.posts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.post{border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.post .type{font-size:12px;color:var(--muted)}
.post .val{font-family:var(--head);font-size:24px;font-weight:600}
.post .val small{font-size:13px;font-weight:500;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;padding:0 18px;min-height:44px;font-size:14px;font-weight:600;cursor:pointer;border:0;text-decoration:none}
.btn-primary{background:var(--violet);color:var(--ink)}
.btn-primary:hover{background:var(--violet-hi);color:var(--ink)}
.btn-ghost{background:var(--card);color:var(--text);border:1px solid var(--edge)}
.btn-ghost:hover{border-color:var(--violet)}
.btn[disabled]{opacity:.55;cursor:wait}
.drop{border:2px dashed #8E8A9C;border-radius:14px;padding:36px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;background:#18161F;cursor:pointer;text-align:center}
.drop.over{border-color:var(--violet);background:var(--violet-card)}
.result{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;padding:14px 16px;border-radius:12px;background:var(--violet-card);font-size:14px}
.result.err{background:var(--amber-bg)}
.result .ok{color:var(--violet-txt);font-weight:600}
.result.err .ok{color:var(--amber-txt)}
.conn{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--soft)}
.conn:last-child{border-bottom:0}
.conn b{font-size:15px}
.conn .small{font-size:13px;color:var(--muted)}
code.box{flex:1 1 240px;min-width:0;overflow-x:auto;white-space:nowrap;background:var(--soft);border-radius:10px;padding:12px;font-size:13px;display:block}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:#CFCADB;font-weight:500}
.chat{display:flex;flex-direction:column;gap:14px;max-height:520px;overflow-y:auto;padding-right:4px}
.msg{max-width:88%;padding:12px 16px;font-size:15px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--bubble);border-radius:14px 14px 4px 14px}
.msg.ai{align-self:flex-start;background:var(--soft);border-radius:14px 14px 14px 4px}
.msg.err{align-self:flex-start;background:var(--amber-bg);color:var(--amber-txt);border-radius:14px}
.msg .meta{display:block;margin-top:8px;font-size:12px;color:var(--muted)}
.msg:lang(ar),[dir="rtl"]{font-family:var(--ar)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--card);border:1px solid var(--edge);border-radius:999px;padding:0 14px;min-height:44px;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--violet)}
.plan{border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
.adset{background:#18161F;border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.ad{border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:4px}
.list{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14px;color:#CFCADB}
.empty{text-align:center;padding:48px 20px;display:flex;flex-direction:column;gap:14px;align-items:center}
.spinner{width:18px;height:18px;border:2px solid var(--edge);border-top-color:var(--violet);border-radius:50%;animation:spin 1s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation:none}}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login .card{width:100%;max-width:420px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--violet);color:var(--ink);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:9}
@media (max-width:720px){
  nav.side{max-width:none;flex-basis:100%;border-right:0;border-bottom:1px solid var(--soft);padding:14px 16px;gap:12px;flex-direction:row;flex-wrap:wrap;align-items:center}
  .biz,.statusbox .srow{display:none}
  .statusbox{margin:0 0 0 auto;padding:0;background:none;order:1}
  .statusbox .btn{margin-top:0!important;min-height:40px;padding:0 12px}
  .navlinks{flex-basis:100%;flex-direction:row;overflow-x:auto;gap:6px;order:2}
  .navlinks a{white-space:nowrap;flex:0 0 auto}
  h1{font-size:28px}
  .mstrip{grid-template-columns:1fr 1fr}
  .mstrip button{padding:12px 14px 10px;border-bottom-width:3px}
  .mstrip button:nth-child(2n){border-right:0}
  .mstrip button:nth-child(-n+2){border-top:0}
  .mstrip button:nth-child(n+3){border-top:1px solid var(--line)}
  .mstrip .mv{font-size:19px}
}
</style>

<body>
<div id="app" aria-live="polite"></div>
<noscript>ProAds needs JavaScript turned on.</noscript>
<script>
"use strict";
(function () {
  const root = document.getElementById("app");
  const fmt = new Intl.NumberFormat("en-US");
  const pct = (x) => Math.round((x || 0) * 100) + "%";
  const signed = (x) => (x > 0 ? "+" : x < 0 ? "−" : "") + Math.abs(Math.round(x * 100)) + "%";

  const SVG_TAGS = new Set(["svg", "path", "rect", "line", "circle", "g", "polyline", "text"]);
  // Build DOM safely: all text goes in as text, never as HTML.
  function h(tag, props, ...kids) {
    const el = document.createElementNS(SVG_TAGS.has(tag) ? "http://www.w3.org/2000/svg" : "http://www.w3.org/1999/xhtml", tag);
    for (const [k, v] of Object.entries(props || {})) {
      if (v === null || v === undefined || v === false) continue;
      if (k.startsWith("on")) el.addEventListener(k.slice(2).toLowerCase(), v);
      else if (k === "class") el.setAttribute("class", v);
      else if (k === "style") el.setAttribute("style", v);
      else el.setAttribute(k, v === true ? "" : String(v));
    }
    for (const kid of kids.flat(Infinity)) {
      if (kid === null || kid === undefined || kid === false) continue;
      el.appendChild(kid instanceof Node ? kid : document.createTextNode(String(kid)));
    }
    return el;
  }
  const logo = () => h("svg", { width: 28, height: 28, viewBox: "0 0 28 28", "aria-hidden": "true" },
    h("rect", { width: 28, height: 28, rx: 8, fill: "#A78BFA" }),
    h("path", { d: "M6 17l4-4 4 3 7-8", stroke: "#0D0C12", "stroke-width": "2.4", fill: "none", "stroke-linecap": "round", "stroke-linejoin": "round" }));
  const icon = (d) => h("svg", { width: 18, height: 18, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", "stroke-width": 2, "aria-hidden": "true" }, h("path", { d }));
  const isArabic = (s) => /[؀-ۿ]/.test(s || "");
  function toast(text) {
    const t = h("div", { class: "toast", role: "status" }, text);
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 1800);
  }
  async function copy(text) {
    try { await navigator.clipboard.writeText(text); toast("Copied"); }
    catch (e) { toast("Copy failed: select and copy by hand"); }
  }

  // ---------- session ----------
  const SKEY = "proads.session";
  let session = null;
  try { session = JSON.parse(sessionStorage.getItem(SKEY) || "null"); } catch (e) { session = null; }
  let status = null;

  async function api(path, opts = {}) {
    const headers = Object.assign({ "X-API-Key": session ? session.key : "" }, opts.headers || {});
    let res;
    try { res = await fetch(path, Object.assign({}, opts, { headers })); }
    catch (e) { throw new Error("Cannot reach the server. Check your internet connection."); }
    let data = null;
    try { data = await res.json(); } catch (e) { data = null; }
    if (res.status === 401) { signOut("Your key was not accepted. Please sign in again."); throw new Error("signed out"); }
    if (!res.ok) {
      const msg = data && (data.error || (data.errors && data.errors.join("; "))) || ("Server error " + res.status);
      const err = new Error(msg); err.status = res.status; err.data = data; throw err;
    }
    return data;
  }
  const cid = () => encodeURIComponent(session.client);

  function signOut(message) {
    if (session && !message) fetch("/auth/logout", { method: "POST", headers: { "X-API-Key": session.key } }).catch(() => {});
    session = null; status = null;
    try { sessionStorage.removeItem(SKEY); } catch (e) {}
    renderLogin(message);
  }

  // ---------- sign in ----------
  function renderLogin(message) {
    const client = h("input", { id: "client", autocomplete: "username", required: true, placeholder: "you@business.com" });
    const key = h("input", { id: "key", type: "password", autocomplete: "current-password", required: true });
    const err = h("p", { class: "sub", role: "alert", style: "color: var(--amber-txt)" }, message || "");
    const btn = h("button", { class: "btn btn-primary", type: "submit" }, "Sign in");
    const form = h("form", { class: "card", onsubmit: async (e) => {
      e.preventDefault();
      btn.disabled = true; err.textContent = "";
      try {
        const res = await fetch("/auth/login", { method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ login: client.value.trim(), password: key.value }) });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || "Sign-in failed. Please try again.");
        session = { client: data.client_id, key: data.token };
        status = await api("/status/" + cid());
        try { sessionStorage.setItem(SKEY, JSON.stringify(session)); } catch (e2) {}
        go(location.hash && location.hash !== "#" ? location.hash : "#/home");
      } catch (e2) {
        if (e2.message !== "signed out") err.textContent = /fetch/i.test(e2.message) ? "Cannot reach the server. Check your internet connection." : e2.message;
        session = null; btn.disabled = false;
      }
    } },
      h("a", { class: "brand", href: "/", style: "text-decoration:none;color:inherit" }, logo(), "ProAds"),
      h("div", {}, h("h1", { style: "font-size:26px" }, "Sign in"), h("p", { class: "sub" }, "Use your email and password.")),
      h("label", { class: "f", for: "client" }, "Email (or business ID)", client),
      h("label", { class: "f", for: "key" }, "Password (or access key)", key),
      err, btn,
      h("button", { type: "button", class: "chip", style: "align-self:flex-start;border:0;background:none;padding:0;min-height:32px;color: var(--violet)", onclick: () => renderForgot(client.value) }, "Forgot password?"),
      h("p", { class: "sub", style: "margin:0;font-size:14px" }, "New here? ", h("a", { href: "/#signup" }, "Create a free account")));
    root.replaceChildren(h("div", { class: "login" }, form));
    client.focus();
  }

  function renderForgot(prefill) {
    const email = h("input", { id: "femail", type: "email", autocomplete: "email", required: true, value: /@/.test(prefill || "") ? prefill : "" });
    const out = h("p", { class: "sub", role: "status", style: "margin:0" });
    const btn = h("button", { class: "btn btn-primary", type: "submit" }, "Send reset link");
    const form = h("form", { class: "card", onsubmit: async (e) => {
      e.preventDefault(); btn.disabled = true;
      try {
        const res = await fetch("/auth/forgot", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email: email.value }) });
        const d = await res.json().catch(() => ({}));
        out.textContent = d.message || d.error || "Please try again.";
      } catch (e2) { out.textContent = "Cannot reach the server. Check your internet connection."; }
      btn.disabled = false;
    } },
      h("a", { class: "brand", href: "/", style: "text-decoration:none;color:inherit" }, logo(), "ProAds"),
      h("div", {}, h("h1", { style: "font-size:26px" }, "Reset your password"), h("p", { class: "sub" }, "Enter the email you signed up with.")),
      h("label", { class: "f", for: "femail" }, "Email", email), out, btn,
      h("button", { type: "button", class: "btn btn-ghost", onclick: () => renderLogin() }, "Back to sign in"));
    root.replaceChildren(h("div", { class: "login" }, form));
    email.focus();

  function renderReset(token) {

  function timeLeft(ms) {

  // ---------- home (Shopify-style) ----------

  const PERIOD_LABELS = [["today", "Today"], ["7", "7 days"], ["30", "30 days"], ["90", "90 days"], ["365", "12 months"]];
  const money0 = (v, cur) => fmt.format(Math.round(v)) + " " + cur;

  function niceMax(v) { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }

    const grid = [0, 0.25, 0.5, 0.75, 1].map((f) => h("g", {},
      h("line", { x1: L, x2: W - R, y1: y(max * f), y2: y(max * f), stroke: "#26232F", "stroke-width": 1 }),
      h("text", { x: L - 8, y: y(max * f) + 4, "text-anchor": "end", fill: "#8E8A9C", "font-size": 11 }, fmt.format(Math.round(max * f)))));
    const ticks = n > 1 ? [0, Math.floor((n - 1) / 2), n - 1] : [0];
    const xl = ticks.map((i) => h("text", { x: x(i), y: H - 8, "text-anchor": i === 0 && n > 1 ? "start" : i === n - 1 && n > 1 ? "end" : "middle", fill: "#8E8A9C", "font-size": 11 }, day(dates[i])));
    const hair = h("line", { y1: T, y2: H - B, stroke: "#6E6880", "stroke-width": 1, style: "display:none" });
    const dotC = h("circle", { r: 5, fill: "#A78BFA", stroke: "#15131D", "stroke-width": 2, style: "display:none" });
    const dotP = h("circle", { r: 4, fill: "#6E6880", stroke: "#15131D", "stroke-width": 2, style: "display:none" });
    const tip = h("div", { class: "tip", style: "display:none", role: "status" });
    const hit = h("rect", { x: L, y: T, width: W - L - R, height: H - T - B, fill: "transparent", style: "cursor:crosshair" });
    const svg = h("svg", { viewBox: "0 0 " + W + " " + H, role: "img", "aria-label": "Chart of this period against the previous period" },
      grid, xl,
      h("path", { d: path(prev), fill: "none", stroke: "#6E6880", "stroke-width": 2, "stroke-dasharray": "5 5", "stroke-linejoin": "round" }),
      h("path", { d: path(cur), fill: "none", stroke: "#A78BFA", "stroke-width": 2.5, "stroke-linejoin": "round", "stroke-linecap": "round" }),
      hair, dotP, dotC, hit);
    const wrap = h("div", { class: "chartwrap" }, svg, tip);
    function show(clientX) {
      const r = svg.getBoundingClientRect(), sx = (clientX - r.left) * W / r.width;
      const i = Math.max(0, Math.min(n - 1, Math.round((sx - L) / ((W - L - R) / Math.max(n - 1, 1)))));
      hair.setAttribute("x1", x(i)); hair.setAttribute("x2", x(i)); hair.style.display = "";
      dotC.setAttribute("cx", x(i)); dotC.setAttribute("cy", y(cur[i])); dotC.style.display = "";
      dotP.setAttribute("cx", x(i)); dotP.setAttribute("cy", y(prev[i])); dotP.style.display = "";
      tip.replaceChildren(h("b", {}, day(dates[i])),
        h("div", { class: "r" }, h("span", { class: "key" }, h("i"), "This period"), h("b", {}, fmtV(cur[i]))),
        h("div", { class: "r" }, h("span", { class: "key" }, h("i", { class: "prev" }), "Previous"), h("span", {}, fmtV(prev[i]))));
      tip.style.display = "";
      const px = x(i) * r.width / W, tw = tip.offsetWidth;
      tip.style.left = Math.min(Math.max(px + 14, 0), r.width - tw) + (px + 14 + tw > r.width ? -0 : 0) + "px";
      if (px + 14 + tw > r.width) tip.style.left = Math.max(px - tw - 14, 0) + "px";

    }
    function hide() { [hair, dotC, dotP, tip].forEach((e) => e.style.display = "none"); }
    hit.addEventListener("pointermove", (e) => show(e.clientX));
    hit.addEventListener("pointerdown", (e) => show(e.clientX));
    hit.addEventListener("pointerleave", hide);
    return wrap;
  }

  async function viewHome() {
    const body = h("div", { style: "display:contents" }, loading());

      h("button", { type: "button", "aria-pressed": v === homePeriod ? "true" : "false", onclick: () => {
        homePeriod = v; try { localStorage.setItem("proads.period", v); } catch (e) {} viewHome(); } }, label)));

      h("header", { class: "between", style: "align-items:flex-end" },
        h("div", {}, h("h1", {}, "Home"), h("p", { class: "sub" }, "Compared with the previous period")), periods),

        h("span", { style: "display:flex;flex-direction:column;gap:2px" }, h("b", { style: "font-size:14px" }, x.label), x.done ? null : h("span", { class: "sub", style: "font-size:13px" }, x.how)),
        h("span", { class: "sr" }, x.done ? "done" : "to do")))));
    if (!d.has_data) {
      body.replaceChildren(...[adsBanner(d.ads_access), guide].filter(Boolean), h("section", { class: "card empty" }, h("h2", {}, "Your sales will show here"),
        h("p", { class: "sub" }, "Bring in your sales and this page fills with sales, real profit and orders, day by day."),
        h("a", { class: "btn btn-primary", href: "#/upload" }, "Bring in your sales")));
      return;
    }
    const fmtFor = (k) => k === "orders" ? (v) => fmt.format(v) : (v) => money0(v, cur);
    const M = {}; d.metrics.forEach((m) => M[m.key] = m);
    const chartHost = h("div", {});
    const strip = h("div", { class: "mstrip", role: "group", "aria-label": "Key numbers" });
    function draw() {
      const s = d.series[homeMetric] || d.series.sales;
      chartHost.replaceChildren(lineChart(d.dates, s.current, s.previous, fmtFor(homeMetric), chartHost.clientWidth));
      strip.replaceChildren(...d.metrics.map((m) => {
        const has = !!d.series[m.key];
        return h("button", { type: "button", "aria-pressed": has && m.key === homeMetric ? "true" : "false", disabled: has ? null : true, style: has ? "" : "cursor:default",
          onclick: has ? () => { homeMetric = m.key; draw(); } : null },
          h("span", { class: "ml" }, m.label),
          h("span", { class: "mv" }, m.key === "orders" ? fmt.format(m.value) : money0(m.value, cur)),
          h("span", { class: "between", style: "gap:8px" }, changePill(m.change), has ? sparkline(d.series[m.key].current) : null));
      }));
    }
    const label = (M[homeMetric] || M.sales).label;
    const maxSrc = Math.max(...d.sources.map((x) => x.sales), 1), maxProd = Math.max(...d.products.map((x) => x.sales), 1);
    const listCard = (title, rows, empty) => h("section", { class: "card" }, h("h2", {}, title),
      rows.length ? h("div", { style: "display:flex;flex-direction:column;gap:14px" }, rows) : h("p", { class: "sub", style: "margin:0;font-size:14px" }, empty));

      h("div", { class: "track", role: "img", "aria-label": x.source + ": " + money0(x.sales, cur) }, h("div", { style: "width:" + Math.max(2, Math.round(100 * x.sales / maxSrc)) + "%" })))), "No sales in this period.");
    const products = listCard("Top products", d.products.map((x) => h("div", { class: "hbar" }, h("span", {}, x.product, h("span", { class: "sub", style: "font-size:12px" }, " · " + fmt.format(x.units) + " sold")), h("b", {}, money0(x.sales, cur)),
      h("div", { class: "track", "aria-hidden": "true" }, h("div", { style: "width:" + Math.max(2, Math.round(100 * x.sales / maxProd)) + "%" })))), "Product names appear when your sales include them (Shopify or a product column).");
    const camps = d.campaigns.length ? h("section", { class: "card" }, h("div", { class: "between" }, h("h2", {}, "Campaigns"), h("a", { href: "#/assistant", style: "font-size:13px" }, "New campaign")),
