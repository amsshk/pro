<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ProAds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'%3E%3Crect width='28' height='28' rx='5' fill='%235E9400'/%3E%3Cpath d='M5 19l6-6 4 3 8-9' stroke='%230A0A0A' stroke-width='2.4' fill='none' stroke-linecap='square' stroke-linejoin='miter'/%3E%3C/svg%3E">
<style>
:root{
  color-scheme: light;
  --ink:#FFFFFF; --nav:#FAFAF7; --card:#FFFFFF; --line:#E8E9E3; --soft:#F4F5F0; --field:#FFFFFF; --edge:#D6D9CE;
  --text:#141414; --muted:#5C5C5C; --dim:#7A7A7A; --violet:#5E9400; --violet-hi:#4A7600; --violet-txt:#4A7600;
  --violet-chip:#EEF5E1; --violet-card:#F6FAEE; --violet-edge:#C8DCA3; --bubble:#F1F2EE;
  --amber:#DC2626; --amber-txt:#B91C1C; --amber-bg:#FEF2F2; --amber-chip:#FEE2E2; --loss-bg:#FEE2E2; --loss-txt:#B91C1C; --win:#16A34A; --win-txt:#15803D; --win-bg:#E7F6EC;
  --head:'Space Grotesk', Inter, sans-serif; --body: Inter, system-ui, sans-serif; --ar:'Noto Sans Arabic', Inter, sans-serif;
}
*{box-sizing:border-box}
html{background:var(--ink)}
html,body{margin:0;color:var(--text);font-family:var(--body);font-size:15px}
a{color:var(--violet)}a:hover{color:var(--violet-hi)}
button,input,select,textarea{font:inherit;color:var(--text)}
input,select,textarea{background:var(--field);border:1px solid var(--edge);border-radius:10px;padding:0 12px;min-height:44px;width:100%}
textarea{padding:10px 12px;min-height:80px;resize:vertical}
input::placeholder,textarea::placeholder{color:var(--dim)}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.shell{display:flex;flex-wrap:wrap;min-height:100vh}
nav.side{flex:1 1 232px;max-width:260px;min-width:220px;background:rgba(250,250,247,.86);backdrop-filter:blur(1.5px);-webkit-backdrop-filter:blur(1.5px);border-right:1px solid rgba(94,148,0,.22);padding:28px 20px;display:flex;flex-direction:column;gap:28px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--head);font-weight:700;font-size:20px}
.navlinks{display:flex;flex-direction:column;gap:4px}
.navlinks a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:#3D3D3D;text-decoration:none;font-size:14px;min-height:44px}
.navlinks a[aria-current="page"]{background:#5E9400;color:var(--ink);font-weight:600}
.navlinks a:not([aria-current="page"]):hover{background:var(--violet-chip);color:var(--text)}
.biz{background:var(--soft);border-radius:10px;padding:12px;font-size:14px;display:flex;flex-direction:column;gap:2px}
.biz small{color:var(--dim);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.statusbox{margin-top:auto;background:var(--soft);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 8px}
.srow{display:flex;align-items:center;gap:8px}
main{flex:999 1 560px;min-width:0;padding:32px clamp(16px,3vw,48px) 56px}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
h1{margin:0;font-family:var(--head);font-size:34px;font-weight:700;letter-spacing:-.01em}
h2{margin:0;font-family:var(--head);font-size:20px;font-weight:600}
.sub{margin:0;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:16px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:24px}
.row>.card{flex:1 1 420px}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.uchips{display:flex;flex-wrap:wrap;gap:8px}
.uchip{min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--edge);background:var(--soft);color:var(--text);font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.uchip:hover{border-color:var(--violet)}
.uchip[aria-pressed=true]{background:var(--violet);border-color:var(--violet);color:#fff}
.uchip[aria-pressed=true]::before{content:"✓ "}
.estrip{display:grid;grid-template-columns:minmax(220px,1.4fr) repeat(auto-fit,minmax(150px,1fr));gap:18px;align-items:stretch}
.elead,.ek{display:flex;flex-direction:column;gap:6px;justify-content:center}
.ek{border-left:1px solid var(--line);padding-left:18px}
.ebig{font-family:var(--head);font-size:34px;line-height:1.1;color:var(--text)}
.ek b{font-family:var(--head);font-size:22px}
.egrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.epanel{display:flex;flex-direction:column;gap:12px;position:sticky;top:16px}
.etable td,.etable th{text-align:center;white-space:nowrap}
.etable td:first-child,.etable th:first-child{text-align:left;white-space:normal;min-width:140px}
.erow{cursor:pointer}.erow:hover td{background-blend-mode:lighten;filter:brightness(1.15)}
.erow.sel td{box-shadow:inset 0 1px 0 var(--violet),inset 0 -1px 0 var(--violet)}
.erow.sel td:first-child{box-shadow:inset 1px 1px 0 var(--violet),inset 0 -1px 0 var(--violet)}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.etable{font-size:14px}
@media (max-width:900px){.estrip{grid-template-columns:1fr}.egrid{grid-template-columns:1fr}.epanel{position:static}.ek{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:12px}}
.leaks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:16px}
.leaks li{display:flex;flex-direction:column;gap:6px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.leaks li:last-child{border-bottom:0;padding-bottom:0}
.leakbar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.leakbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#F59E9E,var(--amber))}
.mkeys{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px 22px}
.mkey{display:flex;flex-direction:column;gap:6px;font-size:14px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.pcard{display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;background:var(--soft);border:1px solid var(--edge);border-radius:14px;padding:16px;cursor:pointer;min-height:88px}
.pcard:hover{border-color:var(--violet)}
.pcard b{font-size:15px}
.periods{display:flex;gap:6px;flex-wrap:wrap}
.periods button{background:var(--card);border:1px solid var(--edge);border-radius:10px;min-height:38px;padding:0 14px;font-size:13px;font-weight:600;cursor:pointer}
.periods button[aria-pressed="true"]{background:var(--violet);border-color:var(--violet);color:var(--ink)}
.mstrip{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.mstrip button{background:none;border:0;border-right:1px solid var(--line);border-bottom:3px solid transparent;text-align:left;padding:16px 18px 12px;display:flex;flex-direction:column;gap:6px;cursor:pointer;min-width:0}
.mstrip button:last-child{border-right:0}
.mstrip button:hover{background:var(--soft)}
.mstrip button[aria-pressed="true"]{border-image:linear-gradient(90deg,#C8DCA3,#8CB85A 40%,#5E9400 75%,#3F6800) 1;background:var(--violet-chip)}
.mstrip .ml{font-size:13px;color:var(--muted);text-decoration:underline dotted var(--edge);text-underline-offset:4px}
.mstrip .mv{font-family:var(--head);font-size:24px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chg{font-size:12px;font-weight:600;display:inline-flex;gap:4px;align-items:center}
.chg.up{color:var(--win)}.chg.down{color:var(--amber-txt)}.chg.flat{color:var(--dim)}
.chartwrap{position:relative}
.chartwrap svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:#fff;border:1px solid var(--edge);border-radius:10px;padding:10px 12px;font-size:13px;display:flex;flex-direction:column;gap:4px;min-width:170px;z-index:2;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.tip .r{display:flex;justify-content:space-between;gap:14px}
.key{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.key i{display:inline-block;width:16px;height:0;border-top:2px solid var(--violet)}
.key i.prev{border-top:2px dashed #6B6B6B}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;font-size:14px}
.hbar .track{grid-column:1/-1;height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.hbar .track div{height:100%;border-radius:4px;background:linear-gradient(90deg,#C8DCA3,#8CB85A 40%,#5E9400 75%,#3F6800)}
.guide{display:flex;flex-direction:column;gap:2px}
.guide a{display:flex;gap:12px;align-items:flex-start;padding:10px;border-radius:10px;text-decoration:none;color:var(--text)}
.guide a:hover{background:var(--soft)}
.guide .tick{flex:0 0 22px;height:22px;border-radius:50%;border:2px dashed var(--edge);display:flex;align-items:center;justify-content:center}
.guide .done .tick{border:0;background:var(--violet)}
.guide .done b{color:var(--muted);text-decoration:line-through}
.progress{height:6px;border-radius:3px;background:var(--soft);overflow:hidden}.progress div{height:100%;background:linear-gradient(90deg,#C8DCA3,#8CB85A 40%,#5E9400 75%,#3F6800)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:8px}
.kpi.hi{background:var(--violet-card);border-color:var(--violet-edge)}
.kpi .label{font-size:13px;color:var(--muted)}
.kpi.hi .label{color:var(--violet-txt)}
.kpi .num{font-family:var(--head);font-size:30px;font-weight:600}
.kpi .num small{font-size:16px;color:var(--muted);font-weight:500}
.kpi .note{font-size:13px;color:var(--muted)}
.navtag{margin-left:auto;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:999px;color:#fff;background:#5E9400}
.badge{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.b-measured{color:var(--win-txt);background:var(--win-bg)}
.b-est{color:var(--amber-txt);background:var(--amber-chip)}
.b-neutral{color:#4A4A4A;background:var(--line)}
.actions{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.actions li{display:flex;gap:14px;padding:16px;border-radius:12px;background:var(--violet-card);line-height:1.5}
.actions li.warn{background:var(--amber-bg)}
.num-dot{flex:0 0 32px;height:32px;border-radius:50%;background:var(--violet);color:var(--ink);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px}
.warn .num-dot{background:var(--amber)}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:460px}
th{text-align:left;color:var(--muted);font-weight:500;font-size:13px;padding:10px 8px;border-bottom:1px solid var(--line)}
td{padding:12px 8px;border-bottom:1px solid var(--soft)}
.scroll{overflow-x:auto}
.pill-loss{color:var(--loss-txt);background:var(--loss-bg);padding:3px 8px;border-radius:6px;font-weight:600}
.pill-gain{color:var(--win-txt);background:var(--win-bg);padding:3px 8px;border-radius:6px;font-weight:600}
.bar{height:10px;background:var(--soft);border-radius:999px;overflow:hidden}
.bar>div{height:100%;background:var(--amber)}
.months{display:flex;align-items:flex-end;gap:10px;height:160px;padding-top:8px}
.month{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;height:100%;justify-content:flex-end}
.month .col{width:100%;max-width:56px;background:var(--violet);border-radius:8px 8px 3px 3px;min-height:4px}
.month span{font-size:12px;color:var(--muted);white-space:nowrap}
.posts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.post{border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.post .type{font-size:12px;color:var(--muted)}
.post .val{font-family:var(--head);font-size:24px;font-weight:600}
.post .val small{font-size:13px;font-weight:500;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;padding:0 18px;min-height:44px;font-size:14px;font-weight:600;cursor:pointer;border:0;text-decoration:none}
.btn-primary{background:#5E9400;color:var(--ink)}
.btn-primary:hover{background:#6CA60A;color:var(--ink)}
.btn-ghost{background:var(--card);color:var(--text);border:1px solid var(--edge)}
.btn-ghost:hover{border-color:var(--violet)}
.btn[disabled]{opacity:.55;cursor:wait}
.drop{border:2px dashed #A8B596;border-radius:14px;padding:36px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--soft);cursor:pointer;text-align:center}
.drop.over{border-color:var(--violet);background:var(--violet-card)}
.result{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;padding:14px 16px;border-radius:12px;background:var(--violet-card);font-size:14px}
.result.err{background:var(--amber-bg)}
.result .ok{color:var(--violet-txt);font-weight:600}
.result.err .ok{color:var(--amber-txt)}
.conn{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--soft)}
.conn:last-child{border-bottom:0}
.conn b{font-size:15px}
.conn .small{font-size:13px;color:var(--muted)}
code.box{flex:1 1 240px;min-width:0;overflow-x:auto;white-space:nowrap;background:var(--soft);border-radius:10px;padding:12px;font-size:13px;display:block}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:#333;font-weight:500}
.chat{display:flex;flex-direction:column;gap:14px;max-height:520px;overflow-y:auto;padding-right:4px}
.msg{max-width:88%;padding:12px 16px;font-size:15px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--bubble);border-radius:14px 14px 4px 14px}
.msg.ai{align-self:flex-start;background:var(--soft);border-radius:14px 14px 14px 4px}
.msg.err{align-self:flex-start;background:var(--amber-bg);color:var(--amber-txt);border-radius:14px}
.msg .meta{display:block;margin-top:8px;font-size:12px;color:var(--muted)}
.msg:lang(ar),[dir="rtl"]{font-family:var(--ar)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--card);border:1px solid var(--edge);border-radius:999px;padding:0 14px;min-height:44px;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--violet)}
.plan{border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
.adset{background:var(--soft);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.ad{border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:4px}
.list{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14px;color:#333}
.empty{text-align:center;padding:48px 20px;display:flex;flex-direction:column;gap:14px;align-items:center}
.spinner{width:18px;height:18px;border:2px solid var(--edge);border-top-color:var(--violet);border-radius:50%;animation:spin 1s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation:none}}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login .card{width:100%;max-width:420px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--violet);color:var(--ink);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:9}
@media (max-width:720px){
  nav.side{max-width:none;flex-basis:100%;border-right:0;border-bottom:1px solid var(--soft);padding:14px 16px;gap:12px;flex-direction:row;flex-wrap:wrap;align-items:center}
  .biz,.statusbox .srow{display:none}
  .statusbox{margin:0 0 0 auto;padding:0;background:none;order:1}
  .statusbox .btn{margin-top:0!important;min-height:40px;padding:0 12px}
  .navlinks{flex-basis:100%;flex-direction:row;overflow-x:auto;gap:6px;order:2}
  .navlinks a{white-space:nowrap;flex:0 0 auto}
  h1{font-size:28px}
  .mstrip{grid-template-columns:1fr 1fr}
  .mstrip button{padding:12px 14px 10px;border-bottom-width:3px}
  .mstrip button:nth-child(2n){border-right:0}
  .mstrip button:nth-child(-n+2){border-top:0}
  .mstrip button:nth-child(n+3){border-top:1px solid var(--line)}
  .mstrip .mv{font-size:19px}
}

/* glowing pearl frames */
@property --ga{syntax:"<angle>";inherits:false;initial-value:0deg}
.card,.mstrip{position:relative;isolation:isolate;box-shadow:0 1px 2px rgba(20,20,20,.04),0 0 26px -8px rgba(94,148,0,.22)}
.card::before,.mstrip::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;pointer-events:none;z-index:1;
  background:conic-gradient(from var(--ga),rgba(94,148,0,.55),rgba(200,220,163,.25) 22%,rgba(140,184,90,.6) 45%,rgba(214,217,206,.6) 70%,rgba(94,148,0,.7) 85%,rgba(94,148,0,.55));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;
  animation:glowspin 14s linear infinite}
.mstrip::before{inset:0}
@keyframes glowspin{to{--ga:360deg}}
@media (prefers-reduced-motion:reduce){.card::before,.mstrip::before{animation:none}}
#bgnet{position:fixed;inset:0;width:100vw;height:100vh;z-index:-1;pointer-events:none;opacity:.7}
.card,.mstrip{background:rgba(255,255,255,.9)!important;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
main{background:transparent}

.river{display:block;width:100%;height:auto;overflow:visible}
.river .flow{stroke-dasharray:6 10;animation:flow 1.4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-32}}
@media (prefers-reduced-motion:reduce){.river .flow{animation:none}}
.adkpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.adkpis div{background:var(--soft);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.adkpis span{font-size:12px;color:var(--muted)}.adkpis b{font-family:var(--head);font-size:20px}
.truth{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;background:var(--soft);border-radius:14px;padding:16px}
.truth .side{display:flex;flex-direction:column;gap:4px}.truth .big{font-family:var(--head);font-size:30px;font-weight:700}
.truth .vs{font-size:12px;color:var(--muted);text-align:center}
@media (max-width:560px){.truth{grid-template-columns:1fr}.truth .vs{text-align:left}}

/* day / night switch */
.themetog{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--line);margin-top:4px}
.themetog button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;min-height:34px;border:0;border-radius:999px;background:transparent;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer}
.themetog button svg{width:16px;height:16px}
.themetog button[aria-pressed="true"]{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* ---------- night mode: charcoal glass ---------- */
:root[data-theme="dark"]{
  color-scheme: dark;
  --ink:#0E0E0E; --nav:#121212; --card:#1C1C1C; --line:#2A2A2A; --soft:#242424; --field:#161616; --edge:#333333;
  --text:#F2F2F2; --muted:#A0A0A0; --dim:#7E7E7E; --violet:#5E9400; --violet-hi:#8CC63F; --violet-txt:#9ACD4F;
  --violet-chip:#1E2614; --violet-card:#1A1F14; --violet-edge:#33421F; --bubble:#262626;
  --amber:#F87171; --amber-txt:#FCA5A5; --amber-bg:#2A1617; --amber-chip:#3A1D1F; --loss-bg:#3A1D1F; --loss-txt:#FCA5A5;
  --win:#4ADE80; --win-txt:#86EFAC; --win-bg:#13261A;
}
